<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Your Saint</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { color: #64b5f6; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #e0e0e0; font-size: 1.1em; }
        
        .wallet-bar {
            background: #16213e;
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .wallet-address { color: #64b5f6; font-family: monospace; }
        .connect-btn, .mint-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .connect-btn:hover, .mint-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .mint-btn:disabled { background: #444; cursor: not-allowed; }
        
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }
        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; }
        }
        
        .gear-panel {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
        }
        .gear-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        .gear-slot {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
        }
        .gear-slot h3 {
            color: #64b5f6;
            margin-bottom: 10px;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gear-slot h3 .icon { font-size: 1.2em; }
        
        .select-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .select-row label {
            font-size: 0.75em;
            color: #888;
            min-width: 50px;
        }
        .select-row select {
            flex: 1;
            background: #16213e;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 6px 8px;
            font-size: 0.85em;
            min-width: 120px;
        }
        .select-row select:focus {
            outline: none;
            border-color: #64b5f6;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #64b5f6;
        }
        .checkbox-row label {
            font-size: 0.85em;
            color: #ccc;
        }
        
        .item-preview {
            margin-top: 10px;
            padding: 8px;
            background: #1a1a2e;
            border-radius: 5px;
            font-size: 0.9em;
            color: #ffd700;
            min-height: 24px;
        }
        
        .preview-panel {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            position: sticky;
            top: 20px;
        }
        .preview-panel h2 {
            color: #64b5f6;
            margin-bottom: 15px;
            text-align: center;
        }
        #previewCanvas {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .saint-name-display {
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .saint-name-display .name {
            color: #ffd700;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .mint-section {
            margin-top: 15px;
        }
        .mint-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
        }
        
        .status-message {
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success { color: #4caf50; }
        .error { color: #ff6b6b; }
        .loading { color: #64b5f6; }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #64b5f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .saint-name-section {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .saint-name-section h3 {
            color: #64b5f6;
            margin-bottom: 10px;
        }
        .saint-name-section .select-row {
            margin-bottom: 10px;
        }
        
        .randomize-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            margin-right: 10px;
        }
        .randomize-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        .synth-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .synth-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .synth-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .wallet-input {
            background: #0f3460;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 15px;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 0.85em;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }
        .wallet-input:focus {
            outline: none;
            border-color: #64b5f6;
        }
        .wallet-input::placeholder {
            color: #666;
        }

        .nft-result {
            display: none;
            margin-top: 20px;
        }
        .nft-result.show { display: block; }
        .nft-result a {
            display: inline-block;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #1a1a2e;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>

        function getSlotData(slot) {
            return {
                baseId: parseInt(document.getElementById(`${slot}Base`).value),
                suffixId: parseInt(document.getElementById(`${slot}Suffix`).value),
                namePrefixId: parseInt(document.getElementById(`${slot}NamePrefix`).value),
                nameSuffixId: parseInt(document.getElementById(`${slot}NameSuffix`).value),
                plusOne: document.getElementById(`${slot}PlusOne`).checked
            };
        }

        function buildItemName(baseItems, slot) {
            const data = getSlotData(slot);
            let name = baseItems[data.baseId];
            
            if (data.suffixId > 0) {
                name += " " + SUFFIXES[data.suffixId];
            }
            
            if (data.namePrefixId > 0 && data.nameSuffixId > 0) {
                const prefix = NAME_PREFIXES[data.namePrefixId];
                const suffix = NAME_SUFFIXES[data.nameSuffixId];
                if (data.plusOne) {
                    name = `"${prefix} ${suffix}" ${name} +1`;
                } else {
                    name = `"${prefix} ${suffix}" ${name}`;
                }
            }
            
            return name;
        }

        function getMostCommonOrder() {
            const slots = ['head', 'chest', 'hand', 'waist', 'foot', 'ring', 'neck', 'weapon'];
            const counts = new Array(16).fill(0);
            let orderCount = 0;
            
            slots.forEach(slot => {
                const suffixId = parseInt(document.getElementById(`${slot}Suffix`).value);
                if (suffixId > 0) {
                    counts[suffixId - 1]++;
                    orderCount++;
                }
            });
            
            if (orderCount < 2) return null;
            
            let maxCount = 0;
            let result = 0;
            for (let i = 0; i < 16; i++) {
                if (counts[i] > maxCount) {
                    maxCount = counts[i];
                    result = i;
                }
            }
            return result;
        }

        function buildImageUrl(folder, filenames, baseId, suffixId, namePrefixId, nameSuffixId) {
            const baseName = filenames[baseId];
            if (!baseName) return NO_ITEM[folder];
            
            const hasName = (namePrefixId > 0 && nameSuffixId > 0);
            let suffix;
            
            if (suffixId === 0) {
                suffix = hasName ? 'Plus1' : 'Simple';
            } else {
                const order = ORDER_SUFFIX_IMG[suffixId];
                suffix = hasName ? `${order}_Plus1` : order;
            }
            
            return `${BASE_URL}/${folder}/${baseName}_${suffix}.png`;
        }

        function loadImage(url, folder) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => {
                    const fallback = new Image();
                    fallback.crossOrigin = "anonymous";
                    fallback.onload = () => resolve(fallback);
                    fallback.onerror = () => resolve(fallback);
                    fallback.src = NO_ITEM[folder];
                };
                img.src = url;
            });
        }

                };

                const [chestImg, waistImg, footImg, neckImg, handImg, ringImg, orderImg, headImg, weaponImg] = await Promise.all([
                    loadImage(urls.chest, 'chest-gear'),
                    loadImage(urls.waist, 'waist-gear'),
                    loadImage(urls.foot, 'foot-gear'),
                    loadImage(urls.neck, 'neck-gear'),
                    loadImage(urls.hand, 'hand-gear'),
                    loadImage(urls.ring, 'ring-gear'),
                    loadImage(urls.order, 'order-gear'),
                    loadImage(urls.head, 'head-gear'),
                    loadImage(urls.weapon, 'weapon')

                ctx.fillStyle = '#000000';

                ctx.drawImage(waistImg, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(footImg, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(neckImg, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(handImg, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(ringImg, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(orderImg, 0, 0, canvas.width, canvas.height);

            } catch (error) {

        // Decode uint256 array from hex response
        function decodeUint256Array(hex, count) {
            if (hex.startsWith('0x')) hex = hex.slice(2);
            const values = [];
            for (let i = 0; i < count; i++) {
                const startIndex = i * 64;
                const segment = hex.slice(startIndex, startIndex + 64);
                values.push(parseInt(segment, 16));
            }
            return values;
        }

        // Make JSON-RPC call to Ethereum
        async function ethCall(to, data, rpcUrl) {
            const response = await fetch(rpcUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jsonrpc: '2.0',
                    method: 'eth_call',
                    params: [{ to, data }, 'latest'],
                    id: 1
                })
            });
            const json = await response.json();
            if (json.error) throw new Error(json.error.message);
            return json.result;
        }

                let rpcUrl = rpcEndpoints[0];
                
                // Test which RPC works
                for (const endpoint of rpcEndpoints) {
                    try {
                        const testResponse = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                jsonrpc: '2.0',
                                method: 'eth_blockNumber',
                                params: [],
                                id: 1
                            })
                        });
                        if (testResponse.ok) {
                            rpcUrl = endpoint;
                            break;
                        }
                    } catch (e) {
                        continue;
                    }
                }

                console.log('Using RPC:', rpcUrl);

                // Fetch all slots in parallel
                const slotPromises = Object.entries(SYNTH_SELECTORS).map(async ([slot, selector]) => {
                    const data = selector + paddedAddress;
                    const result = await ethCall(SYNTH_LOOT_ADDRESS, data, rpcUrl);
                    const stats = decodeUint256Array(result, 5);
                    return { slot, stats };
                });

                const results = await Promise.all(slotPromises);

                // Process results and populate form
                results.forEach(({ slot, stats }) => {
                    const [baseId, suffixId, prefixId, nameSuffixId, augmented] = stats;
                    
                    // Map slot names to form IDs
                    const formSlot = slot; // head, chest, hand, waist, foot, ring, neck, weapon
                    
                    // Set base item
                    document.getElementById(`${formSlot}Base`).value = baseId;
                    
                    // Set suffix (order) - Synth Loot uses 1-indexed, our form uses 0 for none
                    // If suffixId > 0, it means there's a suffix
                    document.getElementById(`${formSlot}Suffix`).value = suffixId > 0 ? suffixId : 0;
                    
                    // Set name prefix
                    document.getElementById(`${formSlot}NamePrefix`).value = prefixId > 0 ? prefixId : 0;
                    
                    // Set name suffix  
                    document.getElementById(`${formSlot}NameSuffix`).value = nameSuffixId > 0 ? nameSuffixId : 0;
                    
                    // Set +1 augmented
                    document.getElementById(`${formSlot}PlusOne`).checked = augmented === 1;
                });

                // Randomize saint name (Synth Loot doesn't have this)
                document.getElementById('saintName').value = Math.floor(Math.random() * saintNames.length);
                document.getElementById('saintAdjective').value = Math.floor(Math.random() * saintAdjectives.length);

                updatePreview();
                showStatus('✅ Synthetic Loot loaded for ' + walletInput.slice(0, 6) + '...' + walletInput.slice(-4), 'success');

            } catch (error) {
                console.error('Synth Loot fetch error:', error);
                showStatus('❌ Failed to fetch: ' + error.message, 'error');
            } finally {
                synthBtn.disabled = false;
                synthBtn.textContent = '⛓️ Synth Loot';
            }
        }

        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    alert('Please install MetaMask!');
                    return;
                }

                const baseSepolia = {
                    chainId: '0x14a34',
                    chainName: 'Base Sepolia',
                    nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                    rpcUrls: ['https://sepolia.base.org'],
                    blockExplorerUrls: ['https://sepolia.basescan.org']
                };

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: baseSepolia.chainId }]
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [baseSepolia]
                        });
                    } else {
                        throw switchError;
                    }
                }

                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                userAddress = accounts[0];
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                document.getElementById('walletStatus').textContent = 'Connected: ';
                document.getElementById('walletAddress').textContent = userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
                document.getElementById('connectBtn').textContent = 'Connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('mintBtn').disabled = false;
                document.getElementById('mintBtn').textContent = '⚔️ Forge Saint';
                showStatus('Ready to forge your Saint!', '');

                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) location.reload();
                    else {
                        userAddress = accounts[0];
                        document.getElementById('walletAddress').textContent = userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
                    }
                });

                window.ethereum.on('chainChanged', () => location.reload());

            } catch (error) {
                console.error('Wallet connection error:', error);
                showStatus('Failed to connect: ' + error.message, 'error');
            }
        }

        async function customMint() {
            const mintBtn = document.getElementById('mintBtn');

            try {
                mintBtn.disabled = true;
                showStatus('<div class="spinner"></div> Preparing transaction...', 'loading');

                const head = getSlotData('head');
                const chest = getSlotData('chest');
                const hand = getSlotData('hand');
                const waist = getSlotData('waist');
                const foot = getSlotData('foot');
                const ring = getSlotData('ring');
                const neck = getSlotData('neck');
                const weapon = getSlotData('weapon');
                const saintNameId = parseInt(document.getElementById('saintName').value);
                const saintAdjectiveId = parseInt(document.getElementById('saintAdjective').value);

                const tx = await contract.customMint(
                    head, chest, hand, waist, foot, ring, neck, weapon,
                    saintNameId, saintAdjectiveId
                );

                showStatus('<div class="spinner"></div> Forging in progress... Waiting for confirmation', 'loading');

                const receipt = await tx.wait();
                const mintedEvent = receipt.events.find(e => e.event === 'Minted');
                const tokenId = mintedEvent.args.id.toString();

                showStatus('✅ Successfully forged Saint #' + tokenId + '!', 'success');

                // Show OpenSea link
                const network = await provider.getNetwork();
                let openseaUrl;
                if (network.chainId === 8453) {
                    openseaUrl = `https://opensea.io/assets/base/${CONTRACT_ADDRESS}/${tokenId}`;
                } else if (network.chainId === 84532) {
                    openseaUrl = `https://testnets.opensea.io/assets/base-sepolia/${CONTRACT_ADDRESS}/${tokenId}`;
                } else {
                    openseaUrl = `https://opensea.io/assets/${CONTRACT_ADDRESS}/${tokenId}`;
                }
                document.getElementById('openseaLink').href = openseaUrl;
                document.getElementById('nftResult').classList.add('show');

                mintBtn.disabled = false;

            } catch (error) {
                console.error('Minting error:', error);
                let errorMsg = 'Minting failed';
                if (error.code === 4001) {
                    errorMsg = 'Transaction rejected by user';
                } else if (error.reason) {
                    errorMsg = error.reason;
                } else if (error.message) {
                    errorMsg = error.message;
                }
                showStatus('❌ ' + errorMsg, 'error');
                mintBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = message;
            statusDiv.className = 'status-message ' + type;
        }

        // Initialize
        window.addEventListener('load', async () => {
            initializeDropdowns();
            await loadSaintNamesFromContract();
            updatePreview();

            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) {
                        await connectWallet();
                    }
                } catch (error) {
                    console.error('Error checking wallet:', error);
                }
            }
        });
    </script>
</body>
